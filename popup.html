<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ChatGPT & Claude Exporter – PDF & Markdown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="export-heading">
      <h1>Title</h1>
      <span id="provider" class="provider-pill">Detecting website�</span>
      <button
        id="close"
        class="close-export"
        aria-label="Close export options"
        type="button"
      ></button>
    </header>
    <main>
      <section id="summary" hidden>
        <label class="visually-hidden" for="title">Title</label
        ><input id="title" maxlength="200" />
        <p id="count"></p>
      </section>
      <div id="message-selection"></div>
      <fieldset>
        <legend class="visually-hidden">Export format</legend>
        <div class="formats">
          <label
            ><input
              type="radio"
              name="format"
              value="md"
              aria-label="Markdown"
              checked
            /><span>MD</span></label
          >
          <label
            ><input
              type="radio"
              name="format"
              value="pdf"
              aria-label="PDF"
            /><span>PDF</span></label
          >
          <label
            ><input
              type="radio"
              name="format"
              value="json"
              aria-label="JSON"
            /><span>JSON</span></label
          >
          <label
            ><input
              type="radio"
              name="format"
              value="txt"
              aria-label="Text"
            /><span>Text</span></label
          >
        </div>
      </fieldset>
      <div class="export-actions">
        <div id="compact-format"></div>
        <button id="copy" class="copy-action" disabled>Copy</button>
        <button
          id="export"
          class="export-save"
          aria-label="Download selected messages"
          disabled
        >
          Download
        </button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
